[package]
name = "xiaoyi-rc"
version = "0.1.0"
edition = "2024"
description = "UMDF filter for the XiaoYi_RC remote, in safe Rust (ADR 6)"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = ["report"]

[package.metadata.wdk.driver-model]
driver-type = "UMDF"
umdf-version-major = 2
# UMDF 2.33 needs Windows 11, the Rust package's minimum (ADR 6).
target-umdf-version-minor = 33

[lib]
crate-type = ["cdylib"]
# The linker arguments for the driver DLL would break a test binary.
test = false

[build-dependencies]
# smell: fork URL and rev spelled twice (here and `wdf`) — kept, Cargo cannot share
# one git source between two dependency tables; pinned to our UMDF-fixed fork (ADR 6,
# task Tpkpmd). Fix when `wdf` and `wdk-build` come from crates.io (M4, task Tvx5dx).
wdk-build = { git = "https://github.com/nikicat/windows-drivers-rs", rev = "ae5cbf30f481443133f4674aed5c4d78f0156ac1" }

[dependencies]
wdf = { git = "https://github.com/nikicat/windows-drivers-rs", rev = "ae5cbf30f481443133f4674aed5c4d78f0156ac1" }
xiaoyi-rc-report = { path = "report" }

[profile.dev]
panic = "abort"
lto = true

[profile.release]
panic = "abort"
lto = true
