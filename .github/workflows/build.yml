# Builds and releases the driver package. ADR 4 explains the design.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # gh release create

defaults:
  run:
    shell: powershell

jobs:
  build:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and test
        run: .\build.ps1

      - name: Sign with a one-off certificate
        run: .\sign.ps1 -Ephemeral -TimestampUrl http://timestamp.digicert.com

      - name: Assemble release zip
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "$($env:GITHUB_SHA.Substring(0, 7))" }
          .\package.ps1 -Version $version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xiaoyi-rc-win
          path: dist/*.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME (Get-Item dist\*.zip).FullName --generate-notes

  fuzz:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fuzz
        run: .\fuzz.ps1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: fuzz-crashes
          path: driver-rs/report/fuzz/artifacts/
